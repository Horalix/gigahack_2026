name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: npm ci
      - name: Install build-only libclang
        run: python -m pip install --target .tools/python libclang==18.1.1
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ui
      - run: ./scripts/windows-build.ps1 -Task lint -Release
      - run: ./scripts/windows-build.ps1 -Task test -Release
      - run: ./scripts/windows-build.ps1 -Task package
      - run: npm run test:native-overlay
