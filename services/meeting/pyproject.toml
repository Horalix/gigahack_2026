[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-mom-meeting"
version = "0.1.0"
description = "Offline hospital meeting processing service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "faster-whisper==1.1.1",
  "ctranslate2==4.5.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.2"]

[tool.setuptools]
packages = []
