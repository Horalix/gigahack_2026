# NVIDIA GPU override for the meeting service.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# UNTESTED: written on a machine with no NVIDIA GPU. Qualify it on the RTX 3070 Ti
# laptop before the demo, and keep the native (non-Docker) worker as the fallback.
#
# Host requirements on Windows: a current NVIDIA driver, Docker Desktop using the
# WSL2 backend, and GPU support available in Docker Desktop. Quick check:
#   docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# Both services switch to the `gpu` image target and the laptop8 profile. The API
# needs the profile too: it freezes each job's profile at creation, so an API left
# on `cpu` would keep queuing CPU jobs even though the worker has a GPU.

services:
  api:
    build:
      target: gpu
    environment:
      MOM_PROFILE: ${MOM_PROFILE:-laptop8}

  worker:
    build:
      target: gpu
    environment:
      MOM_PROFILE: ${MOM_PROFILE:-laptop8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
