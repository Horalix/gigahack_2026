# Secure MOM local stack: web UI, meeting API, job worker and mail sink.
#
#   docker compose up -d --build     # first run, and after dependency changes
#   docker compose up -d             # later runs; starts offline once built
#   docker compose ps
#   docker compose logs -f api worker web
#   docker compose down              # add -v to also drop meetings and mail
#
# App:   http://127.0.0.1:1420         API through the same origin: /api/...
# Inbox: http://127.0.0.1:8025
#
# NVIDIA GPU (untested on a machine without one):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Build while online: every download (apt, pip, npm, base images) happens at
# build time. Model weights are never downloaded here; prepare them on the host
# with scripts/hackathon/prepare-models.ps1 and they are mounted read-only.

x-meeting-service: &meeting-service
  build:
    context: .
    dockerfile: docker/meeting.Dockerfile
    target: cpu
  init: true
  restart: unless-stopped
  volumes:
    # SQLite + uploaded media. A named volume, not a Windows bind mount:
    # SQLite WAL locking is unreliable across the Windows-to-Linux file share,
    # and the API and worker both write this database.
    - meeting-data:/data
    # Model weights prepared on the host, read-only. Override the host path
    # with MOM_HOST_MODEL_DIR. An empty folder is fine until a job starts: job
    # start then fails closed on the missing asset, by design.
    - ${MOM_HOST_MODEL_DIR:-${LOCALAPPDATA}/SecureMOM/models}:/models:ro

services:
  api:
    <<: *meeting-service
    container_name: securemom-api
    environment:
      # Profile is resolved and frozen into each job when the API creates it,
      # so this setting decides CPU vs GPU for new jobs, not the worker's.
      MOM_PROFILE: ${MOM_PROFILE:-cpu}
      # SYNTHETIC DEV ONLY. Enables the temporary X-Demo-Principal hook in
      # api.py. PBI-005 replaces it with real local authentication; do not use
      # this stack with real patient data until then.
      MOM_SYNTHETIC_DEV: "1"
    ports:
      # Published here because `web` shares this container's network
      # namespace. Only the web app's port is exposed; the API itself listens
      # on 127.0.0.1:8000 inside the namespace and is not published at all.
      - "127.0.0.1:1420:1420"
    # Security boundary, stated precisely: everything that can reach the Vite
    # proxy on 1420 is treated as loopback by the API. The host port is bound to
    # 127.0.0.1, so nothing off this machine can reach it. Other containers ON
    # this machine can, whatever network they are on: Docker 29 blocks
    # cross-network traffic to unpublished ports but lets any container reach a
    # published port by container IP (verified both ways). The separate network
    # below is hygiene, not the boundary. The boundary is "this machine", which
    # is what the synthetic-dev hook assumes; PBI-005 authentication is the real
    # control, and real patient data waits for it.
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *meeting-service
    container_name: securemom-worker
    command: ["python", "-m", "services.meeting.jobs"]
    environment:
      MOM_PROFILE: ${MOM_PROFILE:-cpu}
    # The worker only reads the shared database and media and runs local
    # inference. It gets no network interface at all: the process that touches
    # audio and model weights cannot reach anything, local or remote.
    network_mode: none
    depends_on:
      api:
        condition: service_healthy   # API applies schema migrations first

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: securemom-web
    init: true
    restart: unless-stopped
    # Why the web container shares the API's network namespace:
    #
    # The API's synthetic-dev check admits requests only when the socket peer
    # is loopback. Across a normal Docker network the peer is a container or
    # gateway address, so every request would be denied. Sharing the namespace
    # makes Vite's /api proxy reach the API on 127.0.0.1 genuinely, which is
    # the same trust path as running both natively. No header is forged and
    # api.py is unchanged.
    network_mode: service:api
    environment:
      VITE_USE_POLLING: "1"   # file events do not cross the Windows bind mount
      # Dev-only fake Tauri runtime so the legacy caption screen at "/" renders
      # in a browser (see src/lib/dev/tauri-mock.ts). The doctor pages do not
      # use it. Set to "0" to see how the browser path behaves without it.
      VITE_TAURI_MOCK: "1"
    volumes:
      # Source only, read-only. node_modules and .svelte-kit stay inside the
      # container, so Linux binaries never mix with the Windows checkout.
      # Changes to vite.config.js, svelte.config.js or package.json need
      # `docker compose up -d --build web` (or a restart for the configs).
      - ./src:/app/src:ro
      - ./static:/app/static:ro
      - ./svelte.config.js:/app/svelte.config.js:ro
      - ./vite.config.js:/app/vite.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    # Pinned by tag AND digest. A bare tag can be re-pointed upstream; the digest
    # makes `up` reproducible and lets it start with no network at all, provided
    # the image is already in the local store (docker pull once while online).
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    container_name: securemom-mailpit
    restart: unless-stopped

    ports:
      # Loopback-only. Without the 127.0.0.1 prefix Docker publishes on 0.0.0.0
      # and punches through the Windows firewall, putting an open SMTP sink and
      # an unauthenticated web API on the conference Wi-Fi.
      - "127.0.0.1:1025:1025"   # SMTP   <- the delivery stage submits here
      - "127.0.0.1:8025:8025"   # web inbox + REST API

    environment:
      MP_MAX_MESSAGES: 0                 # never evict captured mail mid-demo
      MP_DATABASE: /data/mailpit.db      # survives container restarts

      # ----------------------------------------------------------------------
      # EGRESS: deliberately absent, and must stay absent.
      #
      # Mailpit CAN send real email. Two separate features do it, both off
      # unless configured, and both would fail the challenge's security gate:
      #
      #   MP_SMTP_RELAY_HOST / MP_SMTP_RELAY_CONFIG   "release" a message to the
      #     addresses inside it. Manual via the UI's Release button, or automatic
      #     with MP_SMTP_RELAY_ALL=true / MP_SMTP_RELAY_MATCHING=<regex>.
      #
      #   MP_SMTP_FORWARD_HOST + MP_SMTP_FORWARD_TO   copy every incoming
      #     message to predefined addresses.
      #
      # Setting MP_SMTP_RELAY_HOST=smtp.gmail.com with credentials would deliver
      # real mail to real inboxes. Do not add any MP_SMTP_RELAY_* or
      # MP_SMTP_FORWARD_* variable here or in an .env file.
      #
      # Note: putting this service on a network with `internal: true` blocks
      # egress at the Docker level, but it also silently drops the port mapping
      # above (verified: `docker ps` reports no host binding and the host cannot
      # connect), so the inbox becomes unreachable from the browser. Not usable
      # while we need to demo the inbox. Prove no-egress with the disconnected
      # run instead.
      # ----------------------------------------------------------------------

      # If this is ever exposed beyond loopback, set MP_ALLOWED_HOSTS and
      # MP_UI_AUTH_FILE — Mailpit logs a warning on start because the API is
      # otherwise reachable from anything that can route to the interface.

    volumes:
      - mailpit-data:/data

    # Kept on its own network: the two services share no segment they do not
    # need. (This does not stop it reaching the API's published proxy port; see
    # the note on `api`.) When delivery is integrated, submit from the API side
    # to host.docker.internal:1025 rather than joining the networks.
    networks: [mail]

volumes:
  mailpit-data:
  meeting-data:

networks:
  app: {}
  mail: {}
